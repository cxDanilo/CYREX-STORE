name: Deploy a dev.cyrexstore.com

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            cd ~/domains/cyrexstore.com/public_html/dev/cyrex-app
            git pull
            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:clear
            php artisan view:clear
            git log --pretty=format:'%H|%ad|%s' --date=format:'%Y-%m-%d %H:%M' -n 200 > storage/app/changelog.txt
            git rev-list --count HEAD > storage/app/version.txt
