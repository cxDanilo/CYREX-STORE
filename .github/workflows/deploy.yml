name: Deploy a dev.cyrexstore.com

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # La conexión SSH entre GitHub Actions y el servidor corta de forma
      # transitoria de tanto en tanto ("dial tcp ... i/o timeout", visto en
      # los logs reales) — nunca es un problema del script en sí: relanzar
      # el mismo commit sin tocar nada siempre funciona. En vez de que el
      # usuario tenga que relanzarlo a mano cada vez, se reintenta acá
      # mismo hasta 4 veces (con 20s de espera entre cada uno). Cada intento
      # es completamente idempotente
      # (git pull/composer install/migrate/config:cache se pueden correr
      # de nuevo sin problema), así que repetir todo el script de cero en
      # el siguiente intento es seguro.
      - name: Deploy — intento 1
        id: deploy1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with: &deploy_with
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            cd ~/domains/cyrexstore.com/public_html/dev/cyrex-app

            # El deploy pisa en el lugar el mismo código que está sirviendo
            # el sitio en vivo (sin symlink/carpeta nueva de por medio) —
            # sin esto, cualquier visita real que caiga justo mientras
            # git pull/composer install están a mitad de camino puede
            # toparse con clases/vistas a medio actualizar (así se vio el
            # "Class view does not exist" que reportó el usuario). El
            # trap asegura que el sitio vuelve a estar arriba pase lo que
            # pase, incluso si el deploy falla en el medio — un EXIT solo
            # (sin las señales) NO alcanza: si la conexión SSH entre
            # GitHub y el servidor se corta a mitad de camino (el mismo
            # tipo de corte de red transitorio de acá arriba), el proceso
            # remoto se mata por señal y un trap solo-EXIT nunca llega a
            # dispararse — como pasó la primera vez que se probó esto,
            # dejando el sitio trabado en mantenimiento hasta que se
            # levantó a mano.
            trap 'php artisan up || true' EXIT
            trap 'exit 1' HUP INT TERM
            php artisan down --retry=15 || true

            # git fetch --unshallow puede fallar por la misma flakiness de
            # red de GitHub<->servidor de más arriba — si eso pasa una sola
            # vez y el script sigue de largo, el historial completo se
            # pierde para siempre en este checkout (version.txt/changelog.txt
            # quedan basados en 1 solo commit). Reintenta antes de rendirse,
            # y cae a un --depth bien grande si el unshallow en sí sigue
            # fallando — nunca bloquea el deploy en sí (|| true al final).
            if [ -f .git/shallow ]; then
              echo "Repo shallow — corriendo git fetch --unshallow..."
              git fetch --unshallow || git fetch --unshallow || git fetch --unshallow || true
              if [ -f .git/shallow ]; then
                echo "Seguía shallow, probando con --depth grande como respaldo..."
                git fetch --depth=100000 origin main || true
              fi
            fi

            n=0
            until [ $n -ge 3 ]
            do
              git pull && break
              n=$((n+1))
              echo "git pull falló, reintentando ($n/3)..."
              sleep 5
            done
            if [ $n -ge 3 ]; then
              echo "git pull falló 3 veces seguidas, abortando deploy"
              exit 1
            fi

            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:clear
            php artisan view:clear
            php artisan config:cache
            php artisan view:cache
            # Si por lo que sea el repo terminó shallow igual (a pesar del
            # resguardo de arriba), el conteo de commits sale mucho más bajo
            # que el real — mejor dejar el changelog/versión como estaban
            # (aunque queden un poco viejos) que pisarlos con un "0.0.1" que
            # asusta sin ser cierto.
            NEW_COMMIT_COUNT=$(git rev-list --count HEAD)
            OLD_COMMIT_COUNT=$(cat storage/app/version.txt 2>/dev/null || echo 0)
            if [ "$NEW_COMMIT_COUNT" -ge "$OLD_COMMIT_COUNT" ]; then
              git log --pretty=format:'%H|%ad|%s' --date=format:'%Y-%m-%d %H:%M' -n 200 > storage/app/changelog.txt
              echo "$NEW_COMMIT_COUNT" > storage/app/version.txt
            else
              echo "El conteo de commits bajó ($OLD_COMMIT_COUNT -> $NEW_COMMIT_COUNT), probable repo shallow — no se pisa changelog.txt/version.txt."
            fi

      - name: Esperar antes de reintentar (intento 2)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Deploy — intento 2
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with: *deploy_with

      - name: Esperar antes de reintentar (intento 3)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 20

      - name: Deploy — intento 3
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with: *deploy_with

      - name: Esperar antes de reintentar (intento 4)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: sleep 20

      # Último intento — si este también falla, el job queda en rojo de
      # verdad (nada de continue-on-error), para no esconder un problema
      # real después de 4 intentos seguidos.
      - name: Deploy — intento 4
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with: *deploy_with
