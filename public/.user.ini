; Sube el techo de subida de archivos de PHP — sin esto, un video para
; el hero de fondo (hasta 150MB, ver el validate() de
; Admin\MediaController) se cortaba antes de llegar siquiera a Laravel,
; porque el límite por defecto de PHP (2M/8M en la mayoría de hosts) es
; mucho más chico que eso. Solo aplica bajo PHP-FPM (lo que usa este
; hosting) — si el server corriera con mod_php en cambio, esto se
; ignora solo, sin romper nada.
upload_max_filesize = 160M
post_max_size = 165M
